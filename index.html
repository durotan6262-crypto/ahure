<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000814">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Varlık">
<link rel="manifest" href="manifest.json">
<title>Varlık</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}

#modes button{
  width:44px;min-width:44px;max-width:44px;
  height:44px;min-height:44px;max-height:44px;
  flex:0 0 44px;flex-shrink:0;flex-grow:0;
  padding:2px;font-size:18px;border-radius:50%;
  background:rgba(0,20,40,.5);
  border:1px solid rgba(80,200,255,.35);
  color:#fff;cursor:pointer;
  backdrop-filter:blur(8px);transition:all .3s;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-sizing:border-box;
}
#modes button.on{
  background:rgba(80,200,255,.4);
  border-color:#7ce;
  box-shadow:0 0 20px rgba(80,200,255,.7);
}
#modes button img{
  width:26px;height:26px;
  max-width:26px;max-height:26px;
  object-fit:contain;display:block;
  border-radius:50%;pointer-events:none;
}
#modes button[data-mode="idle"] img{
  width:38px;height:38px;
  max-width:38px;max-height:38px;
}
#modes button svg{
  width:26px;height:26px;
  pointer-events:none;display:block;
}
.world-icon{ filter:drop-shadow(0 0 8px rgba(80,200,255,.7)); }
.danger-icon{ filter:drop-shadow(0 0 8px rgba(255,80,80,.9)); }
.idle-icon{ filter:drop-shadow(0 0 8px rgba(80,200,255,.7)); }
.emergency-icon{
  filter:drop-shadow(0 0 6px rgba(80,200,255,.85));
}
/* Katman kontrolü: Normalde EKG görünür, aktifken spiral görünür */
#modes button[data-mode="emergency"] .ekg-layer{ display:block; }
#modes button[data-mode="emergency"] .spiral-layer{ display:none; }
#modes button[data-mode="emergency"].on .ekg-layer{ display:none; }
#modes button[data-mode="emergency"].on .spiral-layer{ display:block; }
  
/* PROTECTION - Normal hal: mavi neon, sabit yörüngeler */
.protection-icon{
  transition: filter .4s ease;
}
.protection-icon .prot-orbit{
  stroke: #4ddcff;
  transition: stroke .4s ease;
}
.protection-icon .prot-electron{
  fill: #ffffff;
  stroke: #4ddcff;
  transition: fill .4s ease, stroke .4s ease;
}
.protection-icon .prot-core{
  stroke: #4ddcff;
  transition: stroke .4s ease;
}

/* PROTECTION - Aktif hal: mor yörüngeler, mavi elektronlar, parlak çekirdek */
#modes button[data-mode="protection"].on .protection-icon .prot-orbit{
  stroke: #c88fff;
  filter: drop-shadow(0 0 3px #c88fff);
}
#modes button[data-mode="protection"].on .protection-icon .prot-electron{
  fill: #66f5ff;
  stroke: #ffffff;
  filter: drop-shadow(0 0 4px #66f5ff);
}
#modes button[data-mode="protection"].on .protection-icon .prot-core{
  stroke: #e0aaff;
  stroke-width: 1.1;
  filter: drop-shadow(0 0 5px #e0aaff) drop-shadow(0 0 10px #c88fff);
}
#modes button[data-mode="protection"].on .protection-icon{
  filter: drop-shadow(0 0 8px rgba(200,140,255,.9))
         drop-shadow(0 0 16px rgba(120,200,255,.6));
}

/* Tüm atomu döndür (sadece aktifken) */
@keyframes spinProtection {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
#modes button[data-mode="protection"].on .protection-icon .prot-atom{
  animation: spinProtection 14s linear infinite;
  transform-origin: 12px 12px;
}
  

/* WORK: Dünya döner */
#modes button[data-mode="work"].on .world-icon{ animation:spin 6s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* DANGER: resim döner */
#modes button[data-mode="danger"].on .danger-icon{ animation:spinDanger 3s linear infinite; }
@keyframes spinDanger{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* IDLE: Nefes + plazma titreşimi */
@keyframes breatheIdle {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes plasmaShimmer {
  0%   { filter: drop-shadow(0 0 6px rgba(80,200,255,.6)) hue-rotate(0deg)    saturate(1.00) brightness(1.00); }
  25%  { filter: drop-shadow(0 0 12px rgba(80,200,255,.9)) hue-rotate(-15deg) saturate(1.25) brightness(1.15); }
  50%  { filter: drop-shadow(0 0 16px rgba(120,220,255,1)) hue-rotate(-25deg) saturate(1.35) brightness(1.22); }
  75%  { filter: drop-shadow(0 0 12px rgba(80,200,255,.9)) hue-rotate(-10deg) saturate(1.20) brightness(1.10); }
  100% { filter: drop-shadow(0 0 6px rgba(80,200,255,.6)) hue-rotate(0deg)    saturate(1.00) brightness(1.00); }
}
#modes button[data-mode="idle"].on .idle-icon{
  animation: breatheIdle 4s ease-in-out infinite, plasmaShimmer 6s ease-in-out infinite;
}

#modes button[data-mode="emergency"].on .emergency-icon{
  animation: heartPulse 1.4s ease-in-out infinite;
}

/* PROTECTION: Enerji küresi halkaları döner */
@keyframes spinProtection {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
#modes button[data-mode="protection"].on .protection-icon{
  animation: spinProtection 10s linear infinite;
}

#err{ position:fixed;bottom:6px;left:6px;color:#f66;font-size:11px;z-index:999; max-width:90vw;word-break:break-all;display:none; background:rgba(0,0,0,.7);padding:4px 8px;border-radius:6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="modes" style="position:fixed;top:14px;right:14px;left:auto;bottom:auto;z-index:100;display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;white-space:nowrap;width:max-content;max-width:none;margin:0;padding:0;align-items:center;justify-content:flex-end;">
  <!-- 1. IDLE (Kara Delik) -->
  <button data-mode="idle" class="on">
    <img src="Idle.png" class="idle-icon" alt="Boşta">
  </button>
  <!-- 2. WORK (Dünya) -->
  <button data-mode="work">
    <img src="world.png" class="world-icon" alt="Çalışma">
  </button>
  <!-- 3. DANGER (danger.png) -->
  <button data-mode="danger">
    <img src="danger.png" class="danger-icon" alt="Tehlike">
  </button>
            <!-- 4. EMERGENCY -->
  <button data-mode="emergency">
    <svg class="emergency-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <path id="ekgPath" d="M2 12 H6 L8 7 L11 17 L14 5 L17 12 H22"/>
        <filter id="ekgGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="0.45" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="1.3" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="spiralGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="0.55" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="spiralPath" pathLength="100"
              d="M 22 12 L 16.79 20.30 L 7.42 19.94 L 3.25 12 L 7.83 4.78 L 15.96 5.14 L 19.5 12 L 15.54 18.13 L 8.67 17.78 L 5.75 12 L 9.08 6.95 L 14.71 7.31 L 17 12 L 14.29 15.97 L 9.92 15.61 L 8.25 12 L 10.33 9.11 L 13.46 9.47 L 14.5 12 L 13.04 13.80 L 11.17 13.44 L 10.75 12 L 11.58 11.28 L 12.21 11.64 L 12 12"/>
      </defs>

      <!-- ================== KATMAN 1: EKG (normal hal) ================== -->
      <g class="ekg-layer">
        <!-- 3 katmanlı mavi neon iz: noktanın arkasında kalır -->
        <use href="#ekgPath" stroke="#1a8cff" stroke-width="1.2" opacity="0.35"
             stroke-dasharray="18 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="18" to="-26" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <use href="#ekgPath" stroke="#3db8ff" stroke-width="1.8" opacity="0.65"
             stroke-dasharray="11 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="11" to="-33" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <use href="#ekgPath" stroke="#7fe4ff" stroke-width="2.3" opacity="1"
             stroke-dasharray="5 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="5" to="-39" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <!-- Mavi nokta -->
        <circle r="1.8" fill="#66f5ff" filter="url(#dotGlow)">
          <animateMotion dur="2.4s" repeatCount="indefinite">
            <mpath href="#ekgPath"/>
          </animateMotion>
          <animate attributeName="opacity"
                   values="0;1;1;1;1;0"
                   keyTimes="0;0.06;0.3;0.7;0.94;1"
                   dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="0.8" fill="#ffffff">
          <animateMotion dur="2.4s" repeatCount="indefinite">
            <mpath href="#ekgPath"/>
          </animateMotion>
          <animate attributeName="opacity"
                   values="0;1;1;1;1;0"
                   keyTimes="0;0.06;0.3;0.7;0.94;1"
                   dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ================== KATMAN 2: SPİRAL + PATLAMA (aktif hal) ================== -->
      <g class="spiral-layer">
        <!-- Soluk arka plan spirali -->
        <use href="#spiralPath" stroke="#0a3a5a" stroke-width="0.7" opacity="0.45"/>

        <!-- Mavi neon iz: dıştan içe çizilir -->
        <use href="#spiralPath" stroke="#1a6aff" stroke-width="3" opacity="0.45"
             stroke-dasharray="100 100" stroke-dashoffset="100" filter="url(#spiralGlow)">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>
        <use href="#spiralPath" stroke="#3db8ff" stroke-width="1.8" opacity="0.9"
             stroke-dasharray="100 100" stroke-dashoffset="100" filter="url(#spiralGlow)">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>
        <use href="#spiralPath" stroke="#cceeff" stroke-width="0.6"
             stroke-dasharray="100 100" stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>

        <!-- Mavi nokta: spiral üzerinde dıştan içe, merkezde sarıya döner -->
        <circle r="1.7" fill="#66f5ff" filter="url(#dotGlow)">
          <animateMotion dur="2.5s" repeatCount="indefinite">
            <mpath href="#spiralPath"/>
          </animateMotion>
          <animate attributeName="fill"
                   values="#66f5ff;#66f5ff;#66f5ff;#ffea00;#ffffff"
                   keyTimes="0;0.5;0.78;0.9;1"
                   dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="r"
                   values="1.7;1.7;1.7;2.6;0"
                   keyTimes="0;0.5;0.78;0.9;1"
                   dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0;1;1;1;1;0"
                   keyTimes="0;0.05;0.5;0.8;0.97;1"
                   dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="0.7" fill="#ffffff">
          <animateMotion dur="2.5s" repeatCount="indefinite">
            <mpath href="#spiralPath"/>
          </animateMotion>
          <animate attributeName="opacity"
                   values="0;1;1;1;0"
                   keyTimes="0;0.05;0.78;0.88;1"
                   dur="2.5s" repeatCount="indefinite"/>
        </circle>

        <!-- Sarı patlama halkası -->
        <circle cx="12" cy="12" r="0" fill="none" stroke="#ffe600" stroke-width="0.8" opacity="0">
          <animate attributeName="r"
                   values="0;0;0;0;5.5;8"
                   keyTimes="0;0.78;0.88;0.92;0.96;1"
                   dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0;0;0;0;0.95;0"
                   keyTimes="0;0.78;0.88;0.92;0.97;1"
                   dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width"
                   values="0.8;0.8;0.8;0.8;1.6;0.2"
                   keyTimes="0;0.78;0.88;0.92;0.97;1"
                   dur="2.5s" repeatCount="indefinite"/>
        </circle>

        <!-- Merkez sarı flaş -->
        <circle cx="12" cy="12" r="0" fill="#ffe600" filter="url(#dotGlow)">
          <animate attributeName="r"
                   values="0;0;0;0;2.8;0"
                   keyTimes="0;0.78;0.88;0.92;0.97;1"
                   dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0;0;0;0;1;0"
                   keyTimes="0;0.78;0.88;0.92;0.97;1"
                   dur="2.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </svg>
  </button>
      <!-- 5. PROTECTION (Atom) -->
  <button data-mode="protection">
    <svg class="protection-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <filter id="protGlow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="0.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="protGlowStrong" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="1" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- TÜM ATOM: aktif olunca döner -->
      <g class="prot-atom">
        <!-- Yörünge 1: Yatay (0°) -->
        <g transform="rotate(0 12 12)">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"
                stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite"
                           path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>

        <!-- Yörünge 2: +60° -->
        <g transform="rotate(60 12 12)">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"
                stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite" begin="1.3s"
                           path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>

        <!-- Yörünge 3: -60° -->
        <g transform="rotate(-60 12 12)">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"
                stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite" begin="2.6s"
                           path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>

        <!-- Merkez çekirdek -->
        <circle class="prot-core" cx="12" cy="12" r="2"
                stroke="#4ddcff" stroke-width="0.9" fill="none" filter="url(#protGlow)"/>
      </g>
    </svg>
  </button>
</div>

<div id="err"></div>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>

<script>
(() => {
  const c = document.getElementById("c");
  const ctx = c.getContext("2d", {alpha:false});
  const glow = document.createElement("canvas");
  const gx = glow.getContext("2d");
  const errEl = document.getElementById("err");
  let W=0, H=0, D=1, cx=0, cy=0, t=0, last=performance.now();
  let P=[], stars=[], trails=[], warpStars=[];
  const TAU = Math.PI*2;
  const introStart = performance.now();
  const INTRO_DURATION = 6000;

  const MODES = {
    idle:       { hueCycle:0, hue:200, hueSpeed:0,  pulse:2.15, breathe:0.72, star:0,  vib:0 },
    work:       { hueCycle:1, hue:200, hueSpeed:55, pulse:2.6,  breathe:1.05, star:14, vib:0 },
    danger:     { hueCycle:0, hue:0,   hueSpeed:0,  pulse:6.5,  breathe:2.4,  star:1.5,vib:0 },
    emergency:  { hueCycle:0, hue:48,  hueSpeed:0,  pulse:4.5,  breathe:3.0,  star:0.8,vib:3 },
    protection: { hueCycle:0, hue:280, hueSpeed:0,  pulse:1.8,  breathe:0.6,  star:2,  vib:0 },
  };
  const A = { hue:200, pulse:2.15, breathe:0.72, star:0, vib:0 };

  let AC=null, mg=null, atmoStarted=false;
  function initA(){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); mg = AC.createGain(); mg.gain.value = 0; mg.connect(AC.destination); return true; }catch(e){ return false; } }
  function atmo(){
    if(!AC || atmoStarted) return; atmoStarted = true;
    const now = AC.currentTime, dur = 60;
    const nb = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
    const nd = nb.getChannelData(0); let l = 0;
    for(let i=0;i<nd.length;i++){ const w = Math.random()*2-1; l = (l + 0.02*w) / 1.02; nd[i] = l * 5; }
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
    const bs = AC.createBiquadFilter(); bs.type = "lowshelf"; bs.frequency.value = 80; bs.gain.value = 12;
    const sg = AC.createGain(); sg.gain.value = 0.30;
    const sub = AC.createOscillator(); sub.type = "sine"; sub.frequency.value = 40;
    const subG = AC.createGain(); subG.gain.value = 0.08;
    ns.connect(lp).connect(bs).connect(sg).connect(mg); sub.connect(subG).connect(mg);
    ns.start(now); sub.start(now);
    mg.gain.setValueAtTime(0, now); mg.gain.linearRampToValueAtTime(0.30, now+0.15); mg.gain.linearRampToValueAtTime(0.0, now+6);
  }
  function tryA(){ if(atmoStarted) return; if(!AC){ if(!initA()) return; } if(AC.state === "suspended") AC.resume().then(atmo).catch(()=>{}); else atmo(); }
  tryA(); setTimeout(tryA,100); setTimeout(tryA,500);
  const kick = ()=>{ tryA(); };
  document.addEventListener("click", kick); document.addEventListener("touchstart", kick);

  function resize(){
    W = innerWidth; H = innerHeight; D = Math.min(devicePixelRatio||1, 2);
    c.width = W*D; c.height = H*D; glow.width = W*D; glow.height = H*D;
    ctx.setTransform(D,0,0,D,0,0); gx.setTransform(D,0,0,D,0,0);
    cx = W*.5; cy = H*.5; build();
  }
  addEventListener("resize", resize); addEventListener("orientationchange", ()=>setTimeout(resize,300));

  function gauss(){ let a=0, b=0; while(!a) a = Math.random(); while(!b) b = Math.random(); return Math.sqrt(-2*Math.log(a)) * Math.cos(TAU*b); }

  function build(){
    P=[]; stars=[]; trails=[]; warpStars=[];
    const scale = Math.min(W,H) * .235;
    const count = Math.min(900, Math.max(520, Math.floor(W*H/2600)));
    for(let i=0;i<count;i++){
      const u = Math.random()*2-1; const ph = Math.random()*TAU; const s = Math.pow(Math.random(), .58);
      const z = u; const ring = Math.sqrt(1-u*u);
      const lobe = 1 + .13*Math.cos(ph*2) + .07*Math.cos(ph*5+z*3);
      const brain = .86 + .15*Math.sin(Math.acos(u)*2.1) + .07*Math.sin(ph*7+u*4);
      const r = scale * (.78 + .32*s) * brain * lobe;
      let x = ring*Math.cos(ph)*r; let y = ring*Math.sin(ph)*r*.92; let zz = z*r*.82;
      x += Math.sign(x||1) * Math.pow(Math.abs(x)/scale, 3) * scale * .035;
      const edge = 1 - Math.min(1, Math.sqrt(x*x+y*y+zz*zz)/(scale*1.3));
      P.push({ x, y, z:zz, ox:x, oy:y, oz:zz, phase: Math.random()*TAU, speed: .45 + Math.random()*.75, size: .45 + Math.random()*1.55, alpha: .25 + Math.random()*.62, edge, pulse: Math.random()*TAU });
    }
    for(let i=0;i<150;i++){ const a = Math.random()*TAU; const r = scale * (1.05 + Math.random()*1.8); stars.push({ x: Math.cos(a)*r*(.8+Math.random()*.7), y: Math.sin(a)*r*(.45+Math.random()*.7), z: gauss()*scale*.8, a: .08 + Math.random()*.3, s: .3 + Math.random()*1.1 }); }
    for(let i=0;i<90;i++){ const a = Math.random()*TAU; trails.push({ a, r: scale*(.62 + Math.random()*.52), len: scale*(.18 + Math.random()*.42), wob: Math.random()*TAU, speed: .25 + Math.random()*.5, alpha: .04 + Math.random()*.12 }); }
    for(let i=0;i<250;i++){ warpStars.push({ x: (Math.random()-0.5)*2, y: (Math.random()-0.5)*2, z: 100 + Math.random()*700, a: 0.5 + Math.random()*0.5, s: 0.6 + Math.random()*1.5 }); }
  }

  function proj(p){ const f = 720/(720 + p.z); return { x: cx + p.x*f, y: cy + p.y*f, s: f }; }
  function radial(X, Y, R, stops){

  let currentMode = "idle";

  function setMode(name){
    if(!MODES[name]) return;

    modeButtons.forEach(b => b.classList.toggle("on", b.dataset.mode === name));
  }
  modeButtons.forEach(b => {
    const handler = (e) => { e.preventDefault(); setMode(b.dataset.mode); };

  });

  function frame(now){
    try {

      bg.addColorStop(0, `hsla(${hue},80%,8%,${.20*visibility})`); bg.addColorStop(.45, `hsla(${hue},70%,4%,${.10*visibility})`); bg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

          const twinkle = 0.55 + 0.45 * Math.sin(t*3.5 + ws.x*12 + ws.y*8); const pHue = (hue + ws.x*30 + 360) % 360; const starAlpha = baseAlpha * twinkle;
          gx.fillStyle = `hsla(${pHue}, 90%, 75%, ${starAlpha * 0.25})`; gx.beginPath(); gx.arc(x, y, Math.max(1, size*2.4), 0, TAU); gx.fill();

      gx.lineWidth = .65*Math.max(0.1, scaleFactor);
      for(let i=0;i<pts.length;i++){
        const A_ = pts[i];
        for(let j=i+1;j<Math.min(pts.length, i+28);j++){
          const B_ = pts[j]; const dx = A_.p.x - B_.p.x; const dy = A_.p.y - B_.p.y; const dz = A_.p.z - B_.p.z;
          const d = Math.sqrt(dx*dx + dy*dy + dz*dz); const maxD = scale*.29;
          if(d < maxD){ const a = (1 - d/maxD) * .08 * visibility; const depth = .35 + .65*A_.q.s; gx.strokeStyle = `hsla(${hue}, 90%, 60%, ${a*depth})`; gx.beginPath(); gx.moveTo(A_.q.x, A_.q.y); gx.lineTo(B_.q.x, B_.q.y); gx.stroke(); }
        }
      }
      for(const o of pts){
        const p = o.p, q = o.q; const pulse = .7 + .3*Math.sin(t*1.8 + p.pulse); const a = p.alpha * (.45 + .55*q.s) * pulse * visibility; const r = Math.max(.45, p.size*q.s);
        gx.fillStyle = `hsla(${hue}, 90%, 55%, ${a*.34})`; gx.beginPath(); gx.arc(q.x, q.y, r*4.2, 0, TAU); gx.fill();
        gx.fillStyle = `hsla(${hue}, 80%, 70%, ${a*.82})`; gx.beginPath(); gx.arc(q.x, q.y, r, 0, TAU); gx.fill();
      }
      for(const s of stars){ const q = proj({ x:s.x*scaleFactor, y:s.y*scaleFactor, z:s.z*scaleFactor }); gx.fillStyle = `hsla(${hue}, 85%, 65%, ${s.a*visibility})`; gx.fillRect(q.x, q.y, s.s, s.s); }
      const pulse = 1 + Math.sin(t*A.pulse)*.045; const coreScale = Math.max(0.01, scale*.34*pulse); const coreBright = intro * intro;
      radial(cxc, cyc, coreScale, [[0, `rgba(255,255,255,${.95*coreBright})`], [.045, `hsla(${hue}, 100%, 75%, ${.75*coreBright})`], [.18, `hsla(${hue}, 95%, 55%, ${.28*coreBright})`], [.55, `hsla(${hue}, 90%, 40%, ${.08*coreBright})`], [1, "rgba(0,0,0,0)"]]);
      const fa = (.42 + .08*Math.sin(t*2.0)) * visibility * scaleFactor; const flareWidth = W * scaleFactor; const fx0 = cxc - flareWidth/2;
      const lg = gx.createLinearGradient(fx0, cyc, fx0+flareWidth, cyc);
      lg.addColorStop(0, `hsla(${hue},90%,40%,0)`); lg.addColorStop(.18, `hsla(${hue},100%,55%,${fa*.06})`); lg.addColorStop(.40, `hsla(${hue},100%,65%,${fa*.16})`); lg.addColorStop(.495, `hsla(${hue},80%,80%,${fa*.58})`); lg.addColorStop(.5, `rgba(235,255,255,${fa})`); lg.addColorStop(.505, `hsla(${hue},80%,80%,${fa*.58})`); lg.addColorStop(.60, `hsla(${hue},100%,65%,${fa*.16})`); lg.addColorStop(.82, `hsla(${hue},100%,55%,${fa*.06})`); lg.addColorStop(1, `hsla(${hue},90%,40%,0)`);
      gx.fillStyle = lg; gx.fillRect(fx0, cyc-.8, flareWidth, 1.6); gx.fillStyle = `hsla(${hue}, 90%, 70%, ${fa*.10})`; gx.fillRect(cxc - scale*1.35, cyc-.35, scale*2.7, .7);
      ctx.globalCompositeOperation = "lighter"; ctx.drawImage(glow, 0, 0, W, H); ctx.globalCompositeOperation = "lighter";
      for(const o of pts){ const p = o.p, q = o.q; const pulse2 = .72 + .28*Math.sin(t*1.7 + p.pulse); const r = Math.max(.35, p.size*q.s*.72); ctx.fillStyle = `hsla(${hue}, 80%, 75%, ${p.alpha*.8*pulse2*visibility})`; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill(); }
      const coreR = Math.max(.1, scale*.045); const core = ctx.createRadialGradient(cxc, cyc, 0, cxc, cyc, coreR);
      core.addColorStop(0, `rgba(255,255,255,${coreBright})`); core.addColorStop(.22, `hsla(${hue}, 100%, 88%, ${.98*coreBright})`); core.addColorStop(.7, `hsla(${hue}, 90%, 65%, ${.25*coreBright})`); core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cxc, cyc, coreR, 0, TAU); ctx.fill();
      if(currentMode === "protection" && visibility > 0.5){
        const shieldPulse = (t * 0.8) % 1; const shieldR = shieldPulse * Math.min(W,H) * 0.55; const shieldAlpha = (1 - shieldPulse) * 0.35 * visibility;
        ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `hsla(${hue}, 100%, 75%, ${shieldAlpha})`; ctx.lineWidth = 3 * D; ctx.beginPath(); ctx.arc(cxc, cyc, shieldR, 0, TAU); ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";
    } catch(e){ errEl.style.display = "block"; errEl.textContent = "Hata: " + e.message; console.error(e); }
    requestAnimationFrame(frame);
  }
  resize(); requestAnimationFrame(frame);
})();
