<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000814">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Varlık">
<link rel="manifest" href="manifest.json">
<title>Varlık</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}

#modes button{
  width:44px;min-width:44px;max-width:44px;
  height:44px;min-height:44px;max-height:44px;
  flex:0 0 44px;flex-shrink:0;flex-grow:0;
  padding:2px;font-size:18px;border-radius:50%;
  background:rgba(0,20,40,.5);
  border:1px solid rgba(80,200,255,.35);
  color:#fff;cursor:pointer;
  backdrop-filter:blur(8px);transition:all .3s;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-sizing:border-box;
}
#modes button.on{
  background:rgba(80,200,255,.4);
  border-color:#7ce;
  box-shadow:0 0 20px rgba(80,200,255,.7);
}
#modes button img{
  width:26px;height:26px;
  max-width:26px;max-height:26px;
  object-fit:contain;display:block;
  border-radius:50%;pointer-events:none;
}
#modes button[data-mode="idle"] img{
  width:38px;height:38px;
  max-width:38px;max-height:38px;
}
#modes button svg{
  width:26px;height:26px;
  pointer-events:none;display:block;
}
.world-icon{ filter:drop-shadow(0 0 8px rgba(80,200,255,.7)); }
.danger-icon{ filter:drop-shadow(0 0 8px rgba(255,80,80,.9)); }
.idle-icon{ filter:drop-shadow(0 0 8px rgba(80,200,255,.7)); }
.protection-icon{ transition: filter .4s ease; }

#modes button[data-mode="work"].on .world-icon{ animation:spin 6s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

#modes button[data-mode="danger"].on .danger-icon{ animation:spinDanger 3s linear infinite; }
@keyframes spinDanger{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

@keyframes breatheIdle {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes plasmaShimmer {
  0%   { filter: drop-shadow(0 0 6px rgba(80,200,255,.6)) hue-rotate(0deg)    saturate(1.00) brightness(1.00); }
  25%  { filter: drop-shadow(0 0 12px rgba(80,200,255,.9)) hue-rotate(-15deg) saturate(1.25) brightness(1.15); }
  50%  { filter: drop-shadow(0 0 16px rgba(120,220,255,1)) hue-rotate(-25deg) saturate(1.35) brightness(1.22); }
  75%  { filter: drop-shadow(0 0 12px rgba(80,200,255,.9)) hue-rotate(-10deg) saturate(1.20) brightness(1.10); }
  100% { filter: drop-shadow(0 0 6px rgba(80,200,255,.6)) hue-rotate(0deg)    saturate(1.00) brightness(1.00); }
}
#modes button[data-mode="idle"].on .idle-icon{
  animation: breatheIdle 4s ease-in-out infinite, plasmaShimmer 6s ease-in-out infinite;
}

/* Emergency katman kontrolü */
#modes button[data-mode="emergency"] .ekg-layer{ display:block; }
#modes button[data-mode="emergency"] .spiral-layer{ display:none; }
#modes button[data-mode="emergency"].on .ekg-layer{ display:none; }
#modes button[data-mode="emergency"].on .spiral-layer{ display:block; }

/* Protection katman kontrolü */
.protection-icon .prot-orbit{ stroke: #4ddcff; transition: stroke .4s ease; }
.protection-icon .prot-electron{ fill: #ffffff; stroke: #4ddcff; transition: fill .4s ease, stroke .4s ease; }
.protection-icon .prot-core{ stroke: #4ddcff; transition: stroke .4s ease; }

#modes button[data-mode="protection"].on .protection-icon .prot-orbit{
  stroke: #c88fff;
  filter: drop-shadow(0 0 3px #c88fff);
}
#modes button[data-mode="protection"].on .protection-icon .prot-electron{
  fill: #66f5ff;
  stroke: #ffffff;
  filter: drop-shadow(0 0 4px #66f5ff);
}
#modes button[data-mode="protection"].on .protection-icon .prot-core{
  stroke: #e0aaff;
  stroke-width: 1.1;
  filter: drop-shadow(0 0 5px #e0aaff) drop-shadow(0 0 10px #c88fff);
}
#modes button[data-mode="protection"].on .protection-icon{
  filter: drop-shadow(0 0 8px rgba(200,140,255,.9))
         drop-shadow(0 0 16px rgba(120,200,255,.6));
}
#modes button[data-mode="protection"].on .orbit-1{
  animation: orbitCW 9s linear infinite;
  transform-origin: 12px 12px; transform-box: view-box;
}
#modes button[data-mode="protection"].on .orbit-2{
  animation: orbitCCW 13s linear infinite;
  transform-origin: 12px 12px; transform-box: view-box;
}
#modes button[data-mode="protection"].on .orbit-3{
  animation: orbitCW 11s linear infinite;
  transform-origin: 12px 12px; transform-box: view-box;
}
@keyframes orbitCW { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes orbitCCW{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }

#err{ position:fixed;bottom:6px;left:6px;color:#f66;font-size:11px;z-index:999; max-width:90vw;word-break:break-all;display:none; background:rgba(0,0,0,.7);padding:4px 8px;border-radius:6px; }

/* ===== VARLIK CHAT ARAYÜZÜ ===== */
#chat-panel{
  position:fixed; left:12px; right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:100; max-width:640px; margin:0 auto;
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
#chat-log{
  display:flex; flex-direction:column; gap:6px;
  max-height:45vh; overflow-y:auto; padding:4px;
  pointer-events:auto; scrollbar-width:thin;
  scrollbar-color:rgba(80,200,255,.3) transparent;
}
#chat-log::-webkit-scrollbar{ width:4px; }
#chat-log::-webkit-scrollbar-thumb{ background:rgba(80,200,255,.3); border-radius:2px; }
.msg{
  padding:8px 14px; border-radius:16px; font-size:14px; line-height:1.45;
  backdrop-filter:blur(10px); animation:msgIn .32s ease-out;
  max-width:85%; word-wrap:break-word;
}
.msg.user{
  align-self:flex-end; background:rgba(80,200,255,.15);
  border:1px solid rgba(80,200,255,.4); color:#cfeeff;
  border-bottom-right-radius:4px;
}
.msg.varlik{
  align-self:flex-start; background:rgba(0,20,40,.6);
  border:1px solid rgba(80,200,255,.35); color:#eaf7ff;
  box-shadow:0 0 12px rgba(80,200,255,.15);
  border-bottom-left-radius:4px;
}
.msg.varlik::before{ content:'◉ '; color:#7ce; font-weight:bold; }
.msg.typing::before{ content:'◉ '; color:#7ce; }
.msg.typing .dots span{ display:inline-block; animation:dotPulse 1.4s infinite; }
.msg.typing .dots span:nth-child(2){ animation-delay:.2s; }
.msg.typing .dots span:nth-child(3){ animation-delay:.4s; }
@keyframes dotPulse{ 0%,60%,100%{opacity:.25;} 30%{opacity:1;} }
@keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

#chat-input-row{
  display:flex; gap:8px; align-items:center;
  background:rgba(0,20,40,.6);
  border:1px solid rgba(80,200,255,.35);
  border-radius:24px; padding:5px 5px 5px 18px;
  backdrop-filter:blur(12px); pointer-events:auto;
  box-shadow:0 0 18px rgba(80,200,255,.1);
}
#chat-input{
  flex:1; background:transparent; border:none; outline:none;
  color:#fff; font-size:16px; font-family:inherit;
  padding:8px 0; min-width:0;
}
#chat-input::placeholder{ color:rgba(180,220,255,.45); }
#chat-send{
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(80,200,255,.5);
  background:rgba(80,200,255,.2); color:#cfeeff;
  cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
#chat-send:hover{ background:rgba(80,200,255,.35); }
#chat-send:active{ transform:scale(.92); }
#chat-send:disabled{ opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="modes" style="position:fixed;top:14px;right:14px;left:auto;bottom:auto;z-index:100;display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;white-space:nowrap;width:max-content;max-width:none;margin:0;padding:0;align-items:center;justify-content:flex-end;">
  <button data-mode="idle" class="on">
    <img src="Idle.png" class="idle-icon" alt="Boşta">
  </button>
  <button data-mode="work">
    <img src="world.png" class="world-icon" alt="Çalışma">
  </button>
  <button data-mode="danger">
    <img src="danger.png" class="danger-icon" alt="Tehlike">
  </button>
  <button data-mode="emergency">
    <svg class="emergency-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <path id="ekgPath" d="M2 12 H6 L8 7 L11 17 L14 5 L17 12 H22"/>
        <filter id="ekgGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="0.45" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="1.3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="spiralGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="0.55" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="spiralPath" pathLength="100"
              d="M 22 12 L 16.79 20.30 L 7.42 19.94 L 3.25 12 L 7.83 4.78 L 15.96 5.14 L 19.5 12 L 15.54 18.13 L 8.67 17.78 L 5.75 12 L 9.08 6.95 L 14.71 7.31 L 17 12 L 14.29 15.97 L 9.92 15.61 L 8.25 12 L 10.33 9.11 L 13.46 9.47 L 14.5 12 L 13.04 13.80 L 11.17 13.44 L 10.75 12 L 11.58 11.28 L 12.21 11.64 L 12 12"/>
      </defs>
      <g class="ekg-layer">
        <use href="#ekgPath" stroke="#1a8cff" stroke-width="1.2" opacity="0.35" stroke-dasharray="18 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="18" to="-26" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <use href="#ekgPath" stroke="#3db8ff" stroke-width="1.8" opacity="0.65" stroke-dasharray="11 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="11" to="-33" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <use href="#ekgPath" stroke="#7fe4ff" stroke-width="2.3" opacity="1" stroke-dasharray="5 100" filter="url(#ekgGlow)">
          <animate attributeName="stroke-dashoffset" from="5" to="-39" dur="2.4s" repeatCount="indefinite"/>
        </use>
        <circle r="1.8" fill="#66f5ff" filter="url(#dotGlow)">
          <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#ekgPath"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.06;0.3;0.7;0.94;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="0.8" fill="#ffffff">
          <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#ekgPath"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.06;0.3;0.7;0.94;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g class="spiral-layer">
        <use href="#spiralPath" stroke="#0a3a5a" stroke-width="0.7" opacity="0.45"/>
        <use href="#spiralPath" stroke="#1a6aff" stroke-width="3" opacity="0.45" stroke-dasharray="100 100" stroke-dashoffset="100" filter="url(#spiralGlow)">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>
        <use href="#spiralPath" stroke="#3db8ff" stroke-width="1.8" opacity="0.9" stroke-dasharray="100 100" stroke-dashoffset="100" filter="url(#spiralGlow)">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>
        <use href="#spiralPath" stroke="#cceeff" stroke-width="0.6" stroke-dasharray="100 100" stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
        </use>
        <circle r="1.7" fill="#66f5ff" filter="url(#dotGlow)">
          <animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#spiralPath"/></animateMotion>
          <animate attributeName="fill" values="#66f5ff;#66f5ff;#66f5ff;#ffea00;#ffffff" keyTimes="0;0.5;0.78;0.9;1" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="1.7;1.7;1.7;2.6;0" keyTimes="0;0.5;0.78;0.9;1" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.05;0.5;0.8;0.97;1" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="0.7" fill="#ffffff">
          <animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#spiralPath"/></animateMotion>
          <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.78;0.88;1" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="12" r="0" fill="none" stroke="#ffe600" stroke-width="0.8" opacity="0">
          <animate attributeName="r" values="0;0;0;0;5.5;8" keyTimes="0;0.78;0.88;0.92;0.96;1" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0;0;0.95;0" keyTimes="0;0.78;0.88;0.92;0.97;1" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="0.8;0.8;0.8;0.8;1.6;0.2" keyTimes="0;0.78;0.88;0.92;0.97;1" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="12" r="0" fill="#ffe600" filter="url(#dotGlow)">
          <animate attributeName="r" values="0;0;0;0;2.8;0" keyTimes="0;0.78;0.88;0.92;0.97;1" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.78;0.88;0.92;0.97;1" dur="2.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </svg>
  </button>
  <button data-mode="protection">
    <svg class="protection-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <filter id="protGlow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="0.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g transform="rotate(0 12 12)">
        <g class="orbit-spin orbit-1">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12" stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite" path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>
      </g>
      <g transform="rotate(60 12 12)">
        <g class="orbit-spin orbit-2">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12" stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite" begin="1.3s" path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>
      </g>
      <g transform="rotate(-60 12 12)">
        <g class="orbit-spin orbit-3">
          <path class="prot-orbit" d="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12" stroke="#4ddcff" stroke-width="0.75" fill="none" filter="url(#protGlow)"/>
          <circle class="prot-electron" r="1.05" fill="#ffffff" stroke="#4ddcff" stroke-width="0.4">
            <animateMotion dur="4s" repeatCount="indefinite" begin="2.6s" path="M 3 12 A 9 4.5 0 1 1 21 12 A 9 4.5 0 1 1 3 12"/>
          </circle>
        </g>
      </g>
      <circle class="prot-core" cx="12" cy="12" r="2" stroke="#4ddcff" stroke-width="0.9" fill="none" filter="url(#protGlow)"/>
    </svg>
  </button>
</div>

<div id="chat-panel">
  <div id="chat-log"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Varlık'a bir şey söyle..." autocomplete="off">
    <button id="chat-send" aria-label="Gönder">➤</button>
  </div>
</div>

<div id="err"></div>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>

<script>
(() => {
  const c = document.getElementById("c");
  const ctx = c.getContext("2d", {alpha:false});
  const glow = document.createElement("canvas");
  const gx = glow.getContext("2d");
  const errEl = document.getElementById("err");
  let W=0, H=0, D=1, cx=0, cy=0, t=0, last=performance.now();
  let P=[], stars=[], trails=[], warpStars=[];
  const TAU = Math.PI*2;
  const introStart = performance.now();
  const INTRO_DURATION = 6000;

  const MODES = {
    idle:       { hueCycle:0, hue:200, hueSpeed:0,  pulse:2.15, breathe:0.72, star:0,  vib:0 },
    work:       { hueCycle:1, hue:200, hueSpeed:55, pulse:2.6,  breathe:1.05, star:0, vib:0 },
    danger:     { hueCycle:0, hue:0,   hueSpeed:0,  pulse:6.5,  breathe:2.4,  star:0,  vib:0 },
    emergency:  { hueCycle:0, hue:48,  hueSpeed:0,  pulse:5.5,  breathe:2.4,  star:0,  vib:0 },
    protection: { hueCycle:0, hue:280, hueSpeed:0,  pulse:1.8,  breathe:0.6,  star:0,  vib:0 },
  };
  const A = { hue:200, pulse:2.15, breathe:0.72, star:0, vib:0 };
  let workPlanets = [];
  let workNextSpawn = 0;
  let currentFlareAngles = [0, Math.PI];
  let workEffects = [];
  let workAbsorbParticles = [];

  let AC=null, mg=null, atmoStarted=false, atmoInterval=null;
  function initA(){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      mg = AC.createGain(); mg.gain.value = 0; mg.connect(AC.destination);
      return true;
    }catch(e){ return false; }
  }
  function atmo(){
    if(!AC || atmoStarted) return;
    atmoStarted = true;
    const now = AC.currentTime, dur = 60;
    const nb = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
    const nd = nb.getChannelData(0); let l = 0;
    for(let i=0;i<nd.length;i++){ const w = Math.random()*2-1; l = (l + 0.02*w) / 1.02; nd[i] = l * 5; }
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
    const bs = AC.createBiquadFilter(); bs.type = "lowshelf"; bs.frequency.value = 80; bs.gain.value = 12;
    const sg = AC.createGain(); sg.gain.value = 0.30;
    const sub = AC.createOscillator(); sub.type = "sine"; sub.frequency.value = 40;
    const subG = AC.createGain(); subG.gain.value = 0.08;
    ns.connect(lp).connect(bs).connect(sg).connect(mg);
    sub.connect(subG).connect(mg);
    ns.start(now); sub.start(now);
    mg.gain.setValueAtTime(0.001, now);
    mg.gain.linearRampToValueAtTime(0.30, now + 1.5);
    if(atmoInterval) clearInterval(atmoInterval);
    atmoInterval = setInterval(atmoPulse, 14000);
  }
  function atmoPulse(){
    if(!AC || !mg) return;
    const now = AC.currentTime;
    mg.gain.cancelScheduledValues(now);
    if(currentMode !== 'idle'){
      mg.gain.setValueAtTime(mg.gain.value, now);
      mg.gain.linearRampToValueAtTime(0.001, now + 0.6);
      return;
    }
    mg.gain.setValueAtTime(0.001, now);
    mg.gain.linearRampToValueAtTime(0.28, now + 1.5);
    mg.gain.linearRampToValueAtTime(0.28, now + 6.0);
    mg.gain.linearRampToValueAtTime(0.001, now + 12.0);
  }
  function tryA(){
    if(atmoStarted) return;
    if(!AC){ if(!initA()) return; }
    if(AC.state === "suspended") AC.resume().then(atmo).catch(()=>{});
    else atmo();
  }
  tryA(); setTimeout(tryA,100); setTimeout(tryA,500);
  const kick = ()=>{ tryA(); };
  document.addEventListener("click", kick);
  document.addEventListener("touchstart", kick);

  function resize(){
    W = innerWidth; H = innerHeight; D = Math.min(devicePixelRatio||1, 2);
    c.width = W*D; c.height = H*D; glow.width = W*D; glow.height = H*D;
    ctx.setTransform(D,0,0,D,0,0); gx.setTransform(D,0,0,D,0,0);
    cx = W*.5; cy = H*.5; build();
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", ()=>setTimeout(resize,300));

  function gauss(){
    let a=0, b=0;
    while(!a) a = Math.random();
    while(!b) b = Math.random();
    return Math.sqrt(-2*Math.log(a)) * Math.cos(TAU*b);
  }

  function build(){
    P=[]; stars=[]; trails=[]; warpStars=[];
    const scale = Math.min(W,H) * .235;
    const count = Math.min(900, Math.max(520, Math.floor(W*H/2600)));
    for(let i=0;i<count;i++){
      const u = Math.random()*2-1; const ph = Math.random()*TAU; const s = Math.pow(Math.random(), .58);
      const z = u; const ring = Math.sqrt(1-u*u);
      const lobe = 1 + .13*Math.cos(ph*2) + .07*Math.cos(ph*5+z*3);
      const brain = .86 + .15*Math.sin(Math.acos(u)*2.1) + .07*Math.sin(ph*7+u*4);
      const r = scale * (.78 + .32*s) * brain * lobe;
      let x = ring*Math.cos(ph)*r; let y = ring*Math.sin(ph)*r*.92; let zz = z*r*.82;
      x += Math.sign(x||1) * Math.pow(Math.abs(x)/scale, 3) * scale * .035;
      const edge = 1 - Math.min(1, Math.sqrt(x*x+y*y+zz*zz)/(scale*1.3));
      P.push({ x, y, z:zz, ox:x, oy:y, oz:zz, phase: Math.random()*TAU, speed: .45 + Math.random()*.75, size: .45 + Math.random()*1.55, alpha: .25 + Math.random()*.62, edge, pulse: Math.random()*TAU });
    }
    for(let i=0;i<150;i++){
      const a = Math.random()*TAU;
      const r = scale * (1.05 + Math.random()*1.8);
      stars.push({ x: Math.cos(a)*r*(.8+Math.random()*.7), y: Math.sin(a)*r*(.45+Math.random()*.7), z: gauss()*scale*.8, a: .08 + Math.random()*.3, s: .3 + Math.random()*1.1 });
    }
    for(let i=0;i<90;i++){
      const a = Math.random()*TAU;
      trails.push({ a, r: scale*(.62 + Math.random()*.52), len: scale*(.18 + Math.random()*.42), wob: Math.random()*TAU, speed: .25 + Math.random()*.5, alpha: .04 + Math.random()*.12 });
    }
    for(let i=0;i<250;i++){
      warpStars.push({ x: (Math.random()-0.5)*2, y: (Math.random()-0.5)*2, z: 100 + Math.random()*700, a: 0.5 + Math.random()*0.5, s: 0.6 + Math.random()*1.5 });
    }
  }

  function proj(p){ const f = 720/(720 + p.z); return { x: cx + p.x*f, y: cy + p.y*f, s: f }; }
  function radial(X, Y, R, stops){
    if(!isFinite(R) || R <= 0) return;
    const g = gx.createRadialGradient(X, Y, 0, X, Y, R);
    for(const s of stops) g.addColorStop(s[0], s[1]);
    gx.fillStyle = g; gx.beginPath(); gx.arc(X, Y, R, 0, TAU); gx.fill();
  }

  let currentMode = "idle";
  const modeButtons = document.querySelectorAll("#modes button");
  function setMode(name){
    if(!MODES[name]) return;
    currentMode = name;
    modeButtons.forEach(b => b.classList.toggle("on", b.dataset.mode === name));
    if(atmoStarted) atmoPulse();
  }
  modeButtons.forEach(b => {
    const handler = (e) => { e.preventDefault(); setMode(b.dataset.mode); };
    b.addEventListener("click", handler);
    b.addEventListener("touchstart", handler, { passive:false });
  });

  function frame(now){
    try {
      const dt = Math.min((now-last)/16.67 || 1, 2);
      last = now; t += .012 * dt;

      const target = MODES[currentMode] || MODES.idle;
      A.pulse   += (target.pulse   - A.pulse)   * 0.05;
      A.breathe += (target.breathe - A.breathe) * 0.05;
      A.star    += (target.star    - A.star)    * 0.05;
      A.vib     += (target.vib     - A.vib)     * 0.05;

      if(target.hueCycle){
        A.hue = (A.hue + target.hueSpeed * dt * 0.016 + 360) % 360;
      } else {
        let hd = target.hue - A.hue;
        while(hd > 180) hd -= 360;
        while(hd < -180) hd += 360;
        A.hue = (A.hue + hd * 0.06 + 360) % 360;
      }
      const hue = A.hue;

      const vibX = Math.sin(t*32) * A.vib;
      const vibY = Math.cos(t*29) * A.vib;
      const cxc = cx + vibX;
      const cyc = cy + vibY;

      const elapsed = now - introStart;
      const raw = Math.min(1, elapsed/INTRO_DURATION);
      const intro = raw < 0.5 ? 4*raw*raw*raw : 1 - Math.pow(-2*raw+2, 3)/2;
      const visibility = intro;
      const scaleFactor = intro;

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(0,0,3,.30)";
      ctx.fillRect(0,0,W,H);

      const bg = ctx.createRadialGradient(cxc, cyc, 0, cxc, cyc, Math.min(W,H)*.62);
      bg.addColorStop(0, `hsla(${hue},80%,8%,${.20*visibility})`);
      bg.addColorStop(.45, `hsla(${hue},70%,4%,${.10*visibility})`);
      bg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,W,H);

      const scale = Math.min(W,H) * .235 * scaleFactor;
      const breathe = 1 + Math.sin(t * A.breathe) * .018 * scaleFactor;
      const spin = t * .045;

      for(const p of P){
        const ang = p.phase + t*p.speed*.17;
        const nx = Math.sin(ang + p.y*.008) * 2.2 * scaleFactor;
        const ny = Math.cos(ang + p.x*.007) * 1.7 * scaleFactor;
        const nz = Math.sin(ang + p.z*.006) * 1.4 * scaleFactor;
        const tgt = p.edge < .15 ? .75 : 1;
        p.x += ((p.ox*scaleFactor*breathe*tgt + nx) - p.x) * .010 * dt;
        p.y += ((p.oy*scaleFactor*breathe*tgt + ny) - p.y) * .010 * dt;
        p.z += ((p.oz*scaleFactor + nz) - p.z) * .009 * dt;
      }

      const pts = [];
      const ca = Math.cos(spin), sa = Math.sin(spin);
      for(const p of P){
        const rx = p.x*ca - p.z*sa;
        const rz = p.x*sa + p.z*ca;
        const pp = { x:rx, y:p.y, z:rz };
        const q = proj(pp);
        pts.push({ p:pp, q });
      }
      pts.sort((a,b) => b.p.z - a.p.z);

      gx.globalCompositeOperation = "source-over";
      gx.clearRect(0,0,W,H);

      radial(cxc, cyc, scale*1.12, [
        [0, `hsla(${hue},90%,45%,${.20*visibility})`],
        [.24, `hsla(${hue},85%,40%,${.11*visibility})`],
        [.62, `hsla(${hue},80%,25%,${.04*visibility})`],
        [1, "rgba(0,0,0,0)"]
      ]);

      gx.globalCompositeOperation = "lighter";

      const warpAlpha = Math.min(1, A.star / 8);
      if(warpAlpha > 0.02){
        const spread = Math.min(W,H) * 0.9;
        for(const ws of warpStars){
          ws.z += A.star * dt * 0.6;
          if(ws.z > 800){
            ws.z = -500;
            ws.x = (Math.random()-0.5)*2;
            ws.y = (Math.random()-0.5)*2;
          }
          const f = 720/(720 + ws.z);
          if(f <= 0.01) continue;
          const x = cxc + ws.x * f * spread;
          const y = cyc + ws.y * f * spread;
          const size = ws.s * f * D * 1.2;
          const baseAlpha = ws.a * warpAlpha * Math.min(1, f * 1.2);
          const twinkle = 0.55 + 0.45 * Math.sin(t*3.5 + ws.x*12 + ws.y*8);
          const pHue = (hue + ws.x*30 + 360) % 360;
          const starAlpha = baseAlpha * twinkle;
          gx.fillStyle = `hsla(${pHue}, 90%, 75%, ${starAlpha * 0.25})`;
          gx.beginPath(); gx.arc(x, y, Math.max(1, size*2.4), 0, TAU); gx.fill();
          gx.fillStyle = `hsla(${pHue}, 60%, 92%, ${starAlpha})`;
          gx.beginPath(); gx.arc(x, y, Math.max(0.5, size), 0, TAU); gx.fill();
        }
      }

      gx.lineCap = "round";
      for(const f of trails){
        const a = f.a + t*f.speed*.11;
        const x0 = cxc + Math.cos(a)*f.r*scaleFactor;
        const y0 = cyc + Math.sin(a)*f.r*.62*scaleFactor;
        const x1 = cxc + Math.cos(a+.25+Math.sin(f.wob+t)*.12)*(f.r+f.len)*scaleFactor;
        const y1 = cyc + Math.sin(a+.25+Math.sin(f.wob+t)*.12)*(f.r+f.len)*.62*scaleFactor;
        const xm = (x0+x1)/2 + Math.sin(t+f.wob)*18*scaleFactor;
        const ym = (y0+y1)/2 + Math.cos(t*.8+f.wob)*15*scaleFactor;
        gx.strokeStyle = `hsla(${hue}, 95%, 55%, ${f.alpha*visibility})`;
        gx.lineWidth = .8*scaleFactor;
        gx.beginPath();
        gx.moveTo(x0, y0);
        gx.quadraticCurveTo(xm, ym, x1, y1);
        gx.stroke();
      }

      gx.lineWidth = .65*Math.max(0.1, scaleFactor);
      for(let i=0;i<pts.length;i++){
        const A_ = pts[i];
        for(let j=i+1;j<Math.min(pts.length, i+28);j++){
          const B_ = pts[j];
          const dx = A_.p.x - B_.p.x;
          const dy = A_.p.y - B_.p.y;
          const dz = A_.p.z - B_.p.z;
          const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
          const maxD = scale*.29;
          if(d < maxD){
            const a = (1 - d/maxD) * .08 * visibility;
            const depth = .35 + .65*A_.q.s;
            gx.strokeStyle = `hsla(${hue}, 90%, 60%, ${a*depth})`;
            gx.beginPath();
            gx.moveTo(A_.q.x, A_.q.y);
            gx.lineTo(B_.q.x, B_.q.y);
            gx.stroke();
          }
        }
      }

      for(const o of pts){
        const p = o.p, q = o.q;
        const pulse = .7 + .3*Math.sin(t*1.8 + p.pulse);
        const a = p.alpha * (.45 + .55*q.s) * pulse * visibility;
        const r = Math.max(.45, p.size*q.s);
        gx.fillStyle = `hsla(${hue}, 90%, 55%, ${a*.34})`;
        gx.beginPath(); gx.arc(q.x, q.y, r*4.2, 0, TAU); gx.fill();
        gx.fillStyle = `hsla(${hue}, 80%, 70%, ${a*.82})`;
        gx.beginPath(); gx.arc(q.x, q.y, r, 0, TAU); gx.fill();
      }

      for(const s of stars){
        const q = proj({ x:s.x*scaleFactor, y:s.y*scaleFactor, z:s.z*scaleFactor });
        gx.fillStyle = `hsla(${hue}, 85%, 65%, ${s.a*visibility})`;
        gx.fillRect(q.x, q.y, s.s, s.s);
      }

      // Emergency: lub-dub kalp atışı. Diğer modlarda normal nabız
      let pulse;
      if(currentMode === 'emergency'){
        const bt = (t * 1.1) % 1;
        const lub = Math.exp(-Math.pow((bt-0.05)/0.06, 2));
        const dub = Math.exp(-Math.pow((bt-0.22)/0.05, 2)) * 0.6;
        pulse = 1 + (lub + dub) * 0.22;
      } else {
        pulse = 1 + Math.sin(t*A.pulse)*.045;
      }
      const coreScale = Math.max(0.01, scale*.34*pulse);
      const coreBright = intro * intro;

      radial(cxc, cyc, coreScale, [
        [0, `rgba(255,255,255,${.95*coreBright})`],
        [.045, `hsla(${hue}, 100%, 75%, ${.75*coreBright})`],
        [.18, `hsla(${hue}, 95%, 55%, ${.28*coreBright})`],
        [.55, `hsla(${hue}, 90%, 40%, ${.08*coreBright})`],
        [1, "rgba(0,0,0,0)"]
      ]);

      const fa = (.42 + .08*Math.sin(t*2.0)) * visibility * scaleFactor;
      const flareWidth = W * scaleFactor;
      const halfFlare = flareWidth / 2;

      // İki uç — bağımsız hedef açı ve yoğunluk
      const targetAngles = [currentFlareAngles[0], currentFlareAngles[1]];
      const flareIntensity = [0.35, 0.35];

      if(currentMode === 'work'){
        // Her uç kendi gezegenini hedeflesin
        for(let f = 0; f < 2; f++){
          if(workPlanets[f]){
            targetAngles[f] = Math.atan2(workPlanets[f].y - cyc, workPlanets[f].x - cxc);
            flareIntensity[f] = 1.0;
          } else {
            // Gezegen yok: yavaş radar taraması (uçlar zıt yönlerde döner)
            targetAngles[f] = currentFlareAngles[f] + (f === 0 ? 0.006 : -0.005) * dt;
            flareIntensity[f] = 0.35;
          }
        }
      } else {
        // Work dışı modlarda klasik yatay flare
        targetAngles[0] = 0;
        targetAngles[1] = Math.PI;
      }

      // Her uç için yumuşak açı takibi
      for(let f = 0; f < 2; f++){
        let dAng = targetAngles[f] - currentFlareAngles[f];
        while(dAng > Math.PI) dAng -= TAU;
        while(dAng < -Math.PI) dAng += TAU;
        currentFlareAngles[f] += dAng * 0.10 * dt;
      }

      // Her ucu merkezden dışa ayrı çiz
      for(let f = 0; f < 2; f++){
        const finalFa = fa * flareIntensity[f];
        const ang = currentFlareAngles[f];
        const ex = Math.cos(ang) * halfFlare;
        const ey = Math.sin(ang) * halfFlare;

        gx.save();
        gx.translate(cxc, cyc);

        // Işının gövdesi (merkezden uca doğru solan gradient)
        const lg = gx.createLinearGradient(0, 0, ex, ey);
        lg.addColorStop(0,    `rgba(235,255,255,${finalFa})`);
        lg.addColorStop(0.05, `hsla(${hue},80%,80%,${finalFa*.58})`);
        lg.addColorStop(0.20, `hsla(${hue},100%,65%,${finalFa*.16})`);
        lg.addColorStop(0.55, `hsla(${hue},100%,55%,${finalFa*.06})`);
        lg.addColorStop(1,    `hsla(${hue},90%,40%,0)`);

        gx.strokeStyle = lg;
        gx.lineWidth = 1.6;
        gx.lineCap = "round";
        gx.beginPath();
        gx.moveTo(0, 0);
        gx.lineTo(ex, ey);
        gx.stroke();

        // Ek ince glow (yakın kısım)
        gx.strokeStyle = `hsla(${hue}, 90%, 70%, ${finalFa*.10})`;
        gx.lineWidth = 3;
        gx.beginPath();
        gx.moveTo(0, 0);
        gx.lineTo(ex * 0.45, ey * 0.45);
        gx.stroke();

        gx.restore();
      }
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(glow, 0, 0, W, H);

      ctx.globalCompositeOperation = "lighter";
      for(const o of pts){
        const p = o.p, q = o.q;
        const pulse2 = .72 + .28*Math.sin(t*1.7 + p.pulse);
        const r = Math.max(.35, p.size*q.s*.72);
        ctx.fillStyle = `hsla(${hue}, 80%, 75%, ${p.alpha*.8*pulse2*visibility})`;
        ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill();
      }

      const coreR = Math.max(.1, scale*.045);
      const core = ctx.createRadialGradient(cxc, cyc, 0, cxc, cyc, coreR);
      core.addColorStop(0, `rgba(255,255,255,${coreBright})`);
      core.addColorStop(.22, `hsla(${hue}, 100%, 88%, ${.98*coreBright})`);
      core.addColorStop(.7, `hsla(${hue}, 90%, 65%, ${.25*coreBright})`);
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(cxc, cyc, coreR, 0, TAU); ctx.fill();
      
                        // WORK: İki gezegen + absorbsiyon + çarpışma
      if(currentMode === 'work' && visibility > 0.5){
        // Yeni gezegen doğur
        if(workPlanets.length < 2 && t > workNextSpawn){
          let angle;
          if(workPlanets.length === 0){
            angle = Math.random() * TAU;
          } else {
            let best = 0, bestMin = -1;
            for(let trial = 0; trial < 8; trial++){
              const cand = Math.random() * TAU;
              let minDist = TAU;
              for(const p of workPlanets){
                let d = Math.abs(cand - p.spawnAngle);
                if(d > Math.PI) d = TAU - d;
                if(d < minDist) minDist = d;
              }
              if(minDist > bestMin){ bestMin = minDist; best = cand; }
            }
            angle = best;
          }
          const dist = Math.min(W,H) * (0.30 + Math.random() * 0.18);
          const pr = Math.min(W,H) * (0.030 + Math.random() * 0.016);
          workPlanets.push({
            x: cxc + Math.cos(angle) * dist,
            y: cyc + Math.sin(angle) * dist * 0.85,
            r: pr,
            born: t,
            life: 5.5 + Math.random() * 2.5,
            spawnAngle: angle,
            spots: Array.from({length: 5 + Math.floor(Math.random()*4)}, () => ({
              ax: (Math.random()-0.5) * 1.6,
              ay: (Math.random()-0.5) * 1.6,
              size: 0.12 + Math.random() * 0.22
            }))
          });
          workNextSpawn = t + 0.6;
        }

        // Çarpışma kontrolü (iki gezegen yaklaşırsa)
        if(workPlanets.length === 2){
          const p0 = workPlanets[0], p1 = workPlanets[1];
          const dx = p1.x - p0.x, dy = p1.y - p0.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          const minD = (p0.r + p1.r) * 2.5;
          if(d < minD){
            workEffects.push({
              type: 'collision',
              x: (p0.x + p1.x) / 2,
              y: (p0.y + p1.y) / 2,
              born: t, life: 1.2,
              r: Math.min(W,H) * 0.18
            });
            workPlanets = [];
            workNextSpawn = t + 1.0;
          }
        }

        // Absorbsiyon: yaşamın son %25'inde parçacık çek
        for(const planet of workPlanets){
          const age = t - planet.born;
          if(age > planet.life * 0.75 && Math.random() < 0.5){
            const a = Math.random() * TAU;
            const d = planet.r * (2.5 + Math.random() * 3.5);
            workAbsorbParticles.push({
              x: planet.x + Math.cos(a) * d,
              y: planet.y + Math.sin(a) * d,
              tx: planet.x, ty: planet.y,
              born: t,
              life: 0.5 + Math.random() * 0.4,
              size: 0.7 + Math.random() * 1.1
            });
          }
        }

        // Ölen gezegenleri çıkar
        for(let i = workPlanets.length - 1; i >= 0; i--){
          if((t - workPlanets[i].born) >= workPlanets[i].life){
            workPlanets.splice(i, 1);
            if(workNextSpawn < t) workNextSpawn = t + 0.5;
          }
        }

        // Her gezegeni çiz
        for(const planet of workPlanets){
          const age = t - planet.born;
          let lifeAlpha = 1;
          if(age < 0.8) lifeAlpha = age / 0.8;
          else if(age > planet.life - 0.8) lifeAlpha = (planet.life - age) / 0.8;
          lifeAlpha = Math.max(0, Math.min(1, lifeAlpha));

          const px = planet.x, py = planet.y, pr = planet.r;
          const dxc = cxc - px, dyc = cyc - py;
          const distC = Math.sqrt(dxc*dxc + dyc*dyc) || 1;
          const nx = dxc / distC, ny = dyc / distC;

          // Dış hale
          ctx.globalCompositeOperation = "lighter";
          const halGrad = ctx.createRadialGradient(px, py, pr*0.5, px, py, pr*2.8);
          halGrad.addColorStop(0, `hsla(${hue}, 80%, 55%, ${0.35 * lifeAlpha})`);
          halGrad.addColorStop(1, `hsla(${hue}, 80%, 45%, 0)`);
          ctx.fillStyle = halGrad;
          ctx.beginPath(); ctx.arc(px, py, pr*2.8, 0, TAU); ctx.fill();

          // Gövde
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = `hsla(${hue}, 75%, 22%, ${0.92 * lifeAlpha})`;
          ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();

          // Yüzeydeki dönen lekeler
          const spin = t * 1.3;
          for(const s of planet.spots){
            const sxs = Math.cos(spin + s.ax * 3) * s.ax * pr;
            if(Math.cos(spin + s.ax * 3) > -0.2){
              ctx.fillStyle = `hsla(${hue}, 70%, 14%, ${0.75 * lifeAlpha})`;
              ctx.beginPath();
              ctx.arc(px + sxs, py + s.ay * pr * 0.85, s.size * pr, 0, TAU);
              ctx.fill();
            }
          }

          // Kenar aydınlanması
          ctx.globalCompositeOperation = "lighter";
          const edgeGrad = ctx.createRadialGradient(
            px + nx * pr * 0.9, py + ny * pr * 0.9, pr*0.05,
            px, py, pr * 1.05
          );
          edgeGrad.addColorStop(0, `hsla(${hue}, 95%, 82%, ${0.85 * lifeAlpha})`);
          edgeGrad.addColorStop(0.6, `hsla(${hue}, 80%, 45%, ${0.15 * lifeAlpha})`);
          edgeGrad.addColorStop(1, `hsla(${hue}, 70%, 20%, 0)`);
          ctx.fillStyle = edgeGrad;
          ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();

          // Temas ışığı (flare ucuna yakın olduğu için güçlendirildi)
          const hitX = px + nx * pr * 0.72;
          const hitY = py + ny * pr * 0.72;
          const hitGrad = ctx.createRadialGradient(hitX, hitY, 0, hitX, hitY, pr * 0.85);
          hitGrad.addColorStop(0, `rgba(255, 255, 255, ${lifeAlpha})`);
          hitGrad.addColorStop(0.3, `hsla(${hue}, 100%, 82%, ${0.7 * lifeAlpha})`);
          hitGrad.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);
          ctx.fillStyle = hitGrad;
          ctx.beginPath(); ctx.arc(hitX, hitY, pr * 0.85, 0, TAU); ctx.fill();

          ctx.globalCompositeOperation = "lighter";
        }
      }

      // Absorbsiyon parçacıkları (her modda temizlenir)
      if(workAbsorbParticles.length > 0){
        ctx.globalCompositeOperation = "lighter";
        for(let i = workAbsorbParticles.length - 1; i >= 0; i--){
          const ap = workAbsorbParticles[i];
          const age = t - ap.born;
          if(age > ap.life){
            workAbsorbParticles.splice(i, 1);
            continue;
          }
          const prog = age / ap.life;
          const ex = ap.x + (ap.tx - ap.x) * prog;
          const ey = ap.y + (ap.ty - ap.y) * prog;
          const alpha = (1 - prog) * visibility;
          const size = ap.size * (1 - prog * 0.4);
          ctx.fillStyle = `hsla(${hue}, 100%, 82%, ${alpha})`;
          ctx.beginPath(); ctx.arc(ex, ey, size * D, 0, TAU); ctx.fill();
          ctx.fillStyle = `hsla(${hue}, 100%, 65%, ${alpha * 0.5})`;
          ctx.beginPath(); ctx.arc(ex, ey, size * 2.2 * D, 0, TAU); ctx.fill();
        }
      }

      // Çarpışma efektleri
      if(workEffects.length > 0){
        ctx.globalCompositeOperation = "lighter";
        for(let i = workEffects.length - 1; i >= 0; i--){
          const ef = workEffects[i];
          const age = t - ef.born;
          if(age > ef.life){
            workEffects.splice(i, 1);
            continue;
          }
          const prog = age / ef.life;
          const rr = ef.r * prog;
          const alpha = (1 - prog) * visibility;

          // Patlama halkası
          ctx.strokeStyle = `hsla(${hue}, 100%, 85%, ${alpha})`;
          ctx.lineWidth = 3 * (1 - prog) * D;
          ctx.beginPath(); ctx.arc(ef.x, ef.y, rr, 0, TAU); ctx.stroke();

          // İkinci iç halka
          ctx.strokeStyle = `hsla(${hue}, 100%, 95%, ${alpha * 0.6})`;
          ctx.lineWidth = 1.5 * (1 - prog) * D;
          ctx.beginPath(); ctx.arc(ef.x, ef.y, rr * 0.7, 0, TAU); ctx.stroke();

          // Merkez flaş
          if(prog < 0.35){
            const flashProg = prog / 0.35;
            const flashR = ef.r * 0.6 * (1 - flashProg);
            const flashG = ctx.createRadialGradient(ef.x, ef.y, 0, ef.x, ef.y, flashR);
            flashG.addColorStop(0, `rgba(255,255,255,${(1-flashProg) * visibility})`);
            flashG.addColorStop(0.5, `hsla(${hue}, 100%, 70%, ${(1-flashProg) * 0.6 * visibility})`);
            flashG.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
            ctx.fillStyle = flashG;
            ctx.beginPath(); ctx.arc(ef.x, ef.y, flashR, 0, TAU); ctx.fill();
          }
        }
      }

                        // DANGER: 3 bağımsız dans eden eliptik yörünge + uydular
      if(currentMode === "danger" && visibility > 0.5){
        ctx.globalCompositeOperation = "lighter";

        // Merkez kırmızı aura (nabız)
        const auraR = scale * (0.30 + Math.sin(t * 3.2) * 0.03);
        const auraG = ctx.createRadialGradient(cxc, cyc, 0, cxc, cyc, auraR);
        auraG.addColorStop(0, `hsla(${hue}, 100%, 68%, ${0.35 * visibility})`);
        auraG.addColorStop(1, `hsla(${hue}, 100%, 45%, 0)`);
        ctx.fillStyle = auraG;
        ctx.beginPath(); ctx.arc(cxc, cyc, auraR, 0, TAU); ctx.fill();

                // 3 yörünge — her biri kendi ekseninde TAM TUR döner
        const orbits = [
          { rotSpd:  0.62, rx: scale*0.85, ry: scale*0.30, spin:  1.5, sats: 2 },
          { rotSpd: -0.52, rx: scale*0.85, ry: scale*0.30, spin: -1.9, sats: 2 },
          { rotSpd:  0.80, rx: scale*0.80, ry: scale*0.28, spin:  2.1, sats: 2 },
        ];

        for(const orb of orbits){
                    // Sürekli tam tur dönüş + uyduların kendi hareketi
          const tiltRad = t * orb.rotSpd;
          const rot = t * orb.spin;

          ctx.save();
          ctx.translate(cxc, cyc);
          ctx.rotate(tiltRad);

          // Glow katmanı
          ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${0.18 * visibility})`;
          ctx.lineWidth = 4 * D;
          ctx.beginPath(); ctx.ellipse(0, 0, orb.rx, orb.ry, 0, 0, TAU); ctx.stroke();

          // Ana çizgi
          ctx.strokeStyle = `hsla(${hue}, 100%, 68%, ${0.78 * visibility})`;
          ctx.lineWidth = 1.4 * D;
          ctx.beginPath(); ctx.ellipse(0, 0, orb.rx, orb.ry, 0, 0, TAU); ctx.stroke();

          // Uydular
          for(let i = 0; i < orb.sats; i++){
            const a = rot + (i / orb.sats) * TAU;
            const sx = Math.cos(a) * orb.rx;
            const sy = Math.sin(a) * orb.ry;

            ctx.fillStyle = `hsla(${hue}, 100%, 55%, ${0.35 * visibility})`;
            ctx.beginPath(); ctx.arc(sx, sy, 4.5 * D, 0, TAU); ctx.fill();
            ctx.fillStyle = `hsla(${hue}, 100%, 78%, ${0.6 * visibility})`;
            ctx.beginPath(); ctx.arc(sx, sy, 2.4 * D, 0, TAU); ctx.fill();
            ctx.fillStyle = `rgba(255,235,235,${0.95 * visibility})`;
            ctx.beginPath(); ctx.arc(sx, sy, 1.1 * D, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }
      }

      // EMERGENCY: sonar halkaları
      if(currentMode === "emergency" && visibility > 0.5){
        ctx.globalCompositeOperation = "lighter";
        const ringCount = 3;
        const ringCycle = 1.6;
        for(let i=0;i<ringCount;i++){
          const phase = ((t / ringCycle) + i/ringCount) % 1;
          const ringR = phase * Math.min(W,H) * 0.55;
          const alpha = (1 - phase) * 0.55 * visibility;
          if(alpha <= 0.01) continue;
          ctx.strokeStyle = `hsla(48, 100%, 65%, ${alpha})`;
          ctx.lineWidth = (2.2 - phase * 1.4) * D;
          ctx.beginPath(); ctx.arc(cxc, cyc, ringR, 0, TAU); ctx.stroke();
          ctx.strokeStyle = `hsla(48, 100%, 80%, ${alpha * 0.35})`;
          ctx.lineWidth = 1 * D;
          ctx.beginPath(); ctx.arc(cxc, cyc, ringR * 0.92, 0, TAU); ctx.stroke();
        }
      }

            // PROTECTION: petek kalkan (honeycomb shield)
      if(currentMode === "protection" && visibility > 0.5){
        const shieldPulse = (t * 0.8) % 1;
        const shieldR = shieldPulse * Math.min(W,H) * 0.55;
        const shieldAlpha = (1 - shieldPulse) * visibility;

        if(shieldR > 10 && shieldAlpha > 0.02){
          ctx.globalCompositeOperation = "lighter";

          const hexSize = Math.max(10, Math.min(W,H) * 0.042);
          const hexW = hexSize * Math.sqrt(3);
          const dy = hexSize * 1.5;

          // Petek deseni (halkanın içi)
          ctx.strokeStyle = `hsla(${hue}, 100%, 78%, ${shieldAlpha * 0.55})`;
          ctx.lineWidth = 0.9 * D;
          ctx.beginPath();

          const cols = Math.ceil(shieldR / hexW) + 1;
          const rows = Math.ceil(shieldR / dy) + 1;

          for(let row = -rows; row <= rows; row++){
            for(let col = -cols; col <= cols; col++){
              let x = col * hexW;
              const y = row * dy;
              if(row % 2 !== 0) x += hexW / 2;

              const dist = Math.sqrt(x*x + y*y);
              if(dist > shieldR - 2) continue;

              const px = cxc + x;
              const py = cyc + y;

              for(let i = 0; i < 6; i++){
                const angle = Math.PI / 3 * i;
                const hx = px + hexSize * Math.cos(angle);
                const hy = py + hexSize * Math.sin(angle);
                if(i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
              }
              ctx.closePath();
            }
          }
          ctx.stroke();

          // Ana parlak halka
          ctx.strokeStyle = `hsla(${hue}, 100%, 80%, ${shieldAlpha * 1.2})`;
          ctx.lineWidth = 3 * D;
          ctx.beginPath(); ctx.arc(cxc, cyc, shieldR, 0, TAU); ctx.stroke();

          // İç ince halka
          ctx.strokeStyle = `hsla(${hue}, 100%, 92%, ${shieldAlpha * 0.6})`;
          ctx.lineWidth = 1.5 * D;
          ctx.beginPath(); ctx.arc(cxc, cyc, shieldR * 0.95, 0, TAU); ctx.stroke();
        }
      }

      ctx.globalCompositeOperation = "source-over";
    } catch(e){
      errEl.style.display = "block";
      errEl.textContent = "Hata: " + e.message;
      console.error(e);
    }
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>

<script>
/* ===== VARLIK CHAT MANTIĞI ===== */
(() => {
  const log = document.getElementById('chat-log');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  let waiting = false;

  function addMsg(text, who){
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    if(who === 'varlik typing'){
      el.className = 'msg varlik typing';
      el.innerHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    } else {
      el.textContent = text;
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function varlikReply(userText){
    const mode = window.__varlikMode || 'idle';
    const t = (userText || '').toLowerCase();

    if(/merhaba|selam|hey|hi|hello/.test(t)) return "Merhaba. Seni dinliyorum.";
    if(/nasılsın|naber|how are you/.test(t)) return "İyiyim. Sistemlerim çalışıyor. Sen nasılsın?";
    if(/adın ne|ismin ne|kimsin/.test(t)) return "Ben Varlık. Sana ait bir yapay zeka.";
    if(/teşekkür|sağol|thanks/.test(t)) return "Rica ederim.";

    const replies = {
      idle:       ["Seni dinliyorum.", "Buradayım.", "Ne düşünüyorsun?", "Anlat bakalım."],
      work:       ["Araştırıyorum...", "Veri topluyorum.", "Çalışma modundayım.", "Analiz ediyorum."],
      danger:     ["Dikkat, bir şey seziyorum.", "Tehdit algılıyorum.", "Tetiktteyim.", "Gözüm üstünde."],
      emergency:  ["Acil durumdayım!", "Hemen müdahale ediyorum!", "Kritik seviye!", "Hızlanıyorum!"],
      protection: ["Seni koruyorum.", "Kalkan aktif.", "Güvendesin.", "Yanındayım."],
    };
    const arr = replies[mode] || replies.idle;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  async function send(){
    const text = input.value.trim();
    if(!text || waiting) return;
    input.value = '';
    addMsg(text, 'user');

    waiting = true;
    sendBtn.disabled = true;
    const typing = addMsg('', 'varlik typing');

    const delay = 500 + Math.random() * 900;
    await new Promise(r => setTimeout(r, delay));

    const reply = varlikReply(text);
    typing.remove();
    addMsg(reply, 'varlik');

    waiting = false;
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
})();
</script>
